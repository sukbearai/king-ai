name = "king-ai-gui"
main = "src/index.ts"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

[vars]
CLOUDFLARE_AI_GATEWAY_ID = "default"

[ai]
binding = "AI"

[secrets]
required = [
  "BETTER_AUTH_SECRET",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "BETTER_AUTH_URL"
]

[[durable_objects.bindings]]
name = "GUI_STATE"
class_name = "GuiState"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "king-ai-auth"
database_id = "9c5077c7-d538-42eb-96d4-70cc4a6ac489"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuiState"]
